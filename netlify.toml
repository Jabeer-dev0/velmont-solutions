# Used when Netlify "Base directory" is set to `website` (recommended).
# Set SITE_URL=https://velmontsolutionsgroup.com in Netlify env when the custom domain is connected.
[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sitemap-index.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sitemaps.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sitemap1.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/post-sitemap.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/page-sitemap.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/category-sitemap.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/news-sitemap.xml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
